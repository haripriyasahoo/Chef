const firebaseConfig = {

const APPROVED_EMAILS = [

const CONNECTED = !!(firebaseConfig.apiKey && firebaseConfig.projectId && firebaseConfig.authDomain);
const FIREBASE_VERSION = '12.19.0';

const SAMPLE = [
 {id:'pasta',title:'Slow Sunday Tomato Pasta',description:'A silky tomato sauce, garlic, and lots of basil. Comfort food at its simplest.',category:'Dinner',prep_minutes:10,cook_minutes:25,servings:3,author_id:'chef-a',author_name:'Chef A',image_url:'https://images.unsplash.com/photo-1473093226795-af9932fe5856?auto=format&fit=crop&w=1000&q=85',ingredients:['250 g pasta','3 tbsp olive oil','4 garlic cloves, thinly sliced','400 g crushed tomatoes','A handful of fresh basil','Salt, black pepper and parmesan'],steps:['Bring generously salted water to a boil and cook pasta until just shy of al dente. Reserve a cup of cooking water.','Warm olive oil in a pan. Gently sauté sliced garlic until fragrant, without browning.','Add tomatoes and simmer 15–20 minutes. Season and stir in torn basil.','Toss pasta with sauce and a splash of pasta water until glossy. Finish with parmesan.']},
 {id:'salad',title:'The Everyday Green Bowl',description:'Crunchy seasonal greens with a bright, lemony dressing.',category:'Lunch',prep_minutes:15,cook_minutes:0,servings:2,author_id:'chef-b',author_name:'Chef B',image_url:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1000&q=85',ingredients:['2 cups mixed leafy greens','1 cucumber, sliced','1 carrot, shredded','1 ripe avocado','2 tbsp olive oil','1 lemon, juiced','Salt and toasted seeds'],steps:['Wash and dry the greens thoroughly.','Slice cucumber and avocado, and shred the carrot.','Whisk olive oil, lemon juice and salt in a small bowl.','Arrange vegetables in bowls, drizzle with dressing, and finish with toasted seeds.']},
 {id:'bowl',title:'Sesame Rice & Veggie Bowl',description:'A colorful rice bowl with crisp vegetables and a tangy sesame finish.',category:'Lunch',prep_minutes:20,cook_minutes:20,servings:2,author_id:'chef-c',author_name:'Chef C',image_url:'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=1000&q=85',ingredients:['1 cup uncooked rice','1 small sweet potato','1 cup broccoli florets','1 avocado','1 tbsp sesame seeds','2 tbsp soy sauce','1 tbsp sesame oil','1 tsp rice vinegar'],steps:['Cook rice until tender according to the package instructions.','Dice sweet potato; roast with a little oil at 210°C for 20 minutes, until golden.','Steam broccoli briefly so it stays vibrant and crisp.','Whisk soy sauce, sesame oil and rice vinegar. Build bowls and spoon dressing over the top.']},
 {id:'noodles',title:'Midnight Sesame Noodles',description:'Quick, spicy noodles with a glossy sesame-chili sauce.',category:'Dinner',prep_minutes:8,cook_minutes:10,servings:2,author_id:'chef-a',author_name:'Chef A',image_url:'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85',ingredients:['200 g noodles','2 tbsp soy sauce','1 tbsp sesame oil','1 tbsp chili crisp','1 tsp honey or sugar','1 garlic clove, grated','2 scallions'],steps:['Cook noodles in a pot of boiling water and save a little cooking liquid.','Combine soy sauce, sesame oil, chili crisp, sweetener and garlic.','Toss hot drained noodles with sauce and a splash of cooking water.','Top with sliced scallions and serve straight away.']},
 {id:'pancakes',title:'Lazy Morning Pancakes',description:'Light golden pancakes, perfect with fresh fruit and maple syrup.',category:'Breakfast',prep_minutes:10,cook_minutes:15,servings:4,author_id:'chef-b',author_name:'Chef B',image_url:'https://images.unsplash.com/photo-1521389508051-d7ffb5dc8f5e?auto=format&fit=crop&w=1000&q=85',ingredients:['1 cup plain flour','1 tbsp sugar','1 tsp baking powder','1 large egg','¾ cup milk','1 tbsp melted butter','Maple syrup and fruit'],steps:['Whisk flour, sugar and baking powder together in a bowl.','Beat egg, milk and butter in a second bowl. Fold wet mixture into dry, leaving a few small lumps.','Cook ladlefuls of batter in a lightly greased skillet over medium heat. Flip when bubbles appear.','Serve warm with maple syrup and fruit.']},

const DEMO_CHEFS=[{id:'chef-a',name:'Chef A'},{id:'chef-b',name:'Chef B'},{id:'chef-c',name:'Chef C'}];
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(String(u),location.href);return ['https:','http:','data:'].includes(x.protocol)?x.href:''}catch{return ''}};
const imageTag=(r,extra='')=>r.image_url&&safeUrl(r.image_url)?`<img loading="lazy" src="${escapeHTML(safeUrl(r.image_url))}" alt="${escapeHTML(r.title)}" ${extra}>`:'';

const mode=CONNECTED?'live':'demo';
let db=null,auth=null,fb=null,user=null,contributor=null,recipes=[],searchTerm='';

function author(){return CONNECTED?(contributor&&user?{id:user.uid,name:contributor.display_name}:null):(activeDemo?(DEMO_CHEFS.find(c=>c.id===activeDemo)||null):null)}
function canEdit(r){const a=author();return !!a&&r.author_id===a.id}
function demoLoad(){try{const val=JSON.parse(localStorage.getItem('chefs-table-recipes-v1'));return Array.isArray(val)?val:SAMPLE.map(x=>({...x}))}catch{return SAMPLE.map(x=>({...x}))}}
function demoSave(){try{localStorage.setItem('chefs-table-recipes-v1',JSON.stringify(recipes));return true}catch{notify('This browser has no room to save. Try a smaller photo.');return false}}
async function refreshRecipes(){if(!CONNECTED){recipes=demoLoad();return;}const snapshot=await fb.getDocs(fb.collection(db,'recipes'));recipes=snapshot.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))}
function refreshContributor(){const email=(user?.email||'').toLowerCase();contributor=(user&&user.emailVerified&&APPROVED_EMAILS.map(e=>e.toLowerCase()).includes(email))?{display_name:user.displayName||email.split('@')[0]}:null;}
async function init(){
 if(!CONNECTED){recipes=demoLoad();render();return;}
 $('#app').innerHTML='<div class="page"><p>Connecting to the shared cookbook…</p></div>';
 try{
  const [appMod,authMod,storeMod]=await Promise.all([
   import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`),
   import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`),
   import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`)
  ]);
  fb={...authMod,...storeMod};const app=appMod.initializeApp(firebaseConfig);
  auth=fb.getAuth(app);db=fb.getFirestore(app);
  fb.onAuthStateChanged(auth, u=>{user=u;refreshContributor();render()});
  fb.onSnapshot(fb.collection(db,'recipes'),snap=>{recipes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));const route=location.hash.split('/')[1]||'';if(!['add','edit'].includes(route))render();else renderNav();},err=>notify('Unable to load recipes: '+err.message));
 }catch(error){$('#app').innerHTML='<section class="page empty"><h3>Firebase could not connect</h3><p>Check your project configuration and internet connection.</p></section>';console.error(error);}
}
function render(){renderNav();const path=decodeURIComponent(location.hash.replace(/^#\/?/,'')||'');const parts=path.split('/').filter(Boolean);const route=parts[0]||'home';if(route==='recipe')renderRecipe(parts[1]);else if(route==='add')renderForm(null);else if(route==='edit')renderForm(parts[1]);else if(route==='manage')renderManage();else if(route==='dashboard')renderDashboard();else if(route==='sign-in')renderSignIn();else renderHome();$('#footer-mode').textContent=CONNECTED?'Firebase shared collection':'Local preview • This browser only'}
function renderNav(){const a=author();$('#top-nav').innerHTML=`<a class="nav-text" href="#/">All recipes</a>${a?`<a class="btn small primary" href="#/add">＋ Add Recipe</a><a class="btn small ghost" href="#/manage">✎ Edit Recipe</a><a class="nav-text" href="#/dashboard">${escapeHTML(a.name)}</a><button type="button" class="btn small ghost" id="signout">Sign out</button>`:`<a class="btn small ghost" href="#/sign-in">Contributor Sign In</a>`}`;$('#mode-bar').innerHTML=`<div class="wrap"><span>${CONNECTED?`<strong>SHARED COOKBOOK</strong> · Everyone can read recipes. Only three approved emails can add or edit.`:`<strong>LOCAL PREVIEW</strong> · Sign in as a demo chef to try Add Recipe and Edit Recipe. Changes stay in this browser.`}</span>${a?`<span>Signed in as <strong>${escapeHTML(a.name)}</strong></span>`:''}</div>`;const out=$('#signout');if(out)out.onclick=async()=>{if(CONNECTED){await fb.signOut(auth);user=null;contributor=null;}else{activeDemo='';sessionStorage.removeItem('chefs-table-preview-user');}location.hash='#/';render();}}
function homeListHtml(items){return items.map((r,i)=>`<a class="index-name" href="#/recipe/${encodeURIComponent(r.id)}"><span class="ordinal">${String(i+1).padStart(2,'0')}</span><span class="name">${escapeHTML(r.title)}</span><span class="arrow">↗</span></a>`).join('')||'<p class="muted">No matching recipes.</p>'}
function homeCardsHtml(items){return items.map(r=>`<a class="recipe-card" href="#/recipe/${encodeURIComponent(r.id)}"><div class="card-image">${imageTag(r)}<span class="category">${escapeHTML(r.category||'Recipe')}</span></div><div class="card-body"><h4>${escapeHTML(r.title)}</h4><p>${escapeHTML(r.description||'A recipe from our shared table.')}</p><div class="card-meta"><span>By ${escapeHTML(r.author_name||'A contributor')}</span><span class="cook">◷ ${clock(r)} min</span></div></div></a>`).join('')||'<div class="empty"><h3>No recipes found</h3><p>Try another search, or be the first to add one.</p></div>'}
function updateHomeLists(){const t=searchTerm.toLowerCase().trim();const list=recipes.filter(r=>(r.title+' '+r.category+' '+(r.description||'')+' '+(r.author_name||'')+' '+(r.ingredients||[]).join(' ')).toLowerCase().includes(t));$('#index-names').innerHTML=homeListHtml(list);$('#recipe-cards').innerHTML=homeCardsHtml(list);$('#recipe-count').textContent=`${list.length} ${list.length===1?'recipe':'recipes'}`}
function renderHome(){$('#app').innerHTML=`<section class="hero"><div class="hero-copy"><div class="overline">The shared recipe collection</div><h1>Good food.<br><i>Better</i> together.</h1><p>One kitchen notebook, three passionate cooks. Explore familiar favorites, discover something new, and keep every recipe in one beautiful place.</p><div class="hero-line"><div><strong>${recipes.length}</strong><br>Recipes collected</div><span>✳</span><div><strong>03</strong><br>Contributing cooks</div></div></div><div class="hero-art"><img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1400&q=85" alt="Fresh, beautifully plated food"><div class="hero-stamp"><small>Made to share</small>Recipes worth remembering.</div></div></section>${author()?`<section class="chef-desk"><div><span class="section-kicker">Your kitchen desk</span><h3>Welcome back, ${escapeHTML(author().name)}.</h3><p>Ready to share something delicious or improve your recipes?</p></div><div class="desk-buttons"><a href="#/add" class="btn primary">＋ Add Recipe</a><a href="#/manage" class="btn ghost">✎ Edit Recipe</a></div></section>`:''}<section class="intro-section" id="all-recipes"><div class="row-between"><div><div class="section-label">✳ The recipe index</div><h2 class="section-heading">All recipes, one table.</h2><p class="section-sub">Find your dish below. Select any name to see its photograph, ingredients, and step-by-step method.</p></div><input type="search" class="search" id="search-recipe" placeholder="Search recipes or ingredients…" value="${escapeHTML(searchTerm)}" aria-label="Search recipes"></div><div class="index-box"><div class="index-top"><span>Recipe directory</span><span id="recipe-count">${recipes.length} recipes</span></div><div id="index-names" class="name-index"></div></div></section><section class="collection"><div class="collection-head"><h3>From our kitchen</h3><span class="count">Browse by photo ↗</span></div><div id="recipe-cards" class="card-grid"></div></section>`;updateHomeLists();$('#search-recipe').addEventListener('input',e=>{searchTerm=e.target.value;updateHomeLists()})}
function renderRecipe(id){const r=recipes.find(x=>String(x.id)===String(id));if(!r){$('#app').innerHTML='<section class="page empty"><h3>Recipe not found</h3><p><a href="#/" class="accent-text">← Back to all recipes</a></p></section>';return}let checked=0;$('#app').innerHTML=`<section class="page"><div class="crumb"><a href="#/">All recipes</a><span class="slash">/</span>${escapeHTML(r.category||'Recipe')}<span class="slash">/</span>${escapeHTML(r.title)}</div><div class="detail-top"><div class="detail-photo">${imageTag(r)}</div><div class="detail-info"><div class="overline">${escapeHTML(r.category||'Home cooking')}</div><h1 class="detail-title">${escapeHTML(r.title)}</h1><p class="detail-description">${escapeHTML(r.description||'From our kitchen to yours.')}</p><div class="stats"><div><strong>${escapeHTML(r.prep_minutes||0)}m</strong><span>Prep</span></div><div><strong>${escapeHTML(r.cook_minutes||0)}m</strong><span>Cook</span></div><div><strong>${escapeHTML(r.servings||1)}</strong><span>Servings</span></div></div><div class="contributed">Recipe by <strong>${escapeHTML(r.author_name||'A contributor')}</strong></div><div class="detail-buttons"><button class="btn ghost" id="print-recipe">↗ Print recipe</button>${canEdit(r)?`<a class="btn primary" href="#/edit/${encodeURIComponent(r.id)}">✎ Edit your recipe</a>`:''}</div></div></div><div class="detail-bottom"><div><div class="section-kicker">Gather everything</div><h2 class="block-title">Ingredients <small id="done-count" class="muted" style="font:12px var(--sans)"></small></h2><ul class="ingredients-list">${(r.ingredients||[]).map(x=>`<li><label class="ingredient"><input type="checkbox" class="ingredient-check"><span>${escapeHTML(x)}</span></label></li>`).join('')}</ul><div class="note-box"><strong>Kitchen note:</strong> Check off each ingredient as you prepare it. Your marks stay on this page while you cook.</div></div><div><div class="section-kicker">The good part</div><h2 class="block-title">How to make it</h2><ol class="steps">${(r.steps||[]).map((x,i)=>`<li class="step"><span class="step-num">${String(i+1).padStart(2,'0')}</span><span class="step-text">${escapeHTML(x)}</span></li>`).join('')}</ol></div></div></section>`;$('#print-recipe').onclick=()=>window.print();const checks=[...document.querySelectorAll('.ingredient-check')];checks.forEach(ch=>ch.addEventListener('change',()=>{$('#done-count').textContent=`${checks.filter(x=>x.checked).length}/${checks.length} ready`}))}
function renderDashboard(){const a=author();if(!a){location.hash='#/sign-in';return;}$('#app').innerHTML=`<section class="chef-dashboard"><div class="crumb"><a href="#/">All recipes</a><span class="slash">/</span>Contributor desk</div><div class="section-kicker">Signed-in kitchen</div><h1>Welcome, ${escapeHTML(a.name)}.</h1><p>Choose what you'd like to do. Your changes will appear in the shared cookbook when connected to Firebase.</p><div class="desk-grid"><a class="desk-tile" href="#/add"><span class="desk-icon">＋</span><strong>Add Recipe</strong><span>Share a new dish with its photo, ingredients and instructions.</span></a><a class="desk-tile" href="#/manage"><span class="desk-icon">✎</span><strong>Edit Recipe</strong><span>Update any of the recipes you've contributed.</span></a></div><p class="notice">${CONNECTED?'You are signed in with an approved email.':'Demo sign-in only: edits are saved on this browser, not shared online.'}</p></section>`}
function renderManage(){const a=author();if(!a){location.hash='#/sign-in';return;}const mine=recipes.filter(canEdit);$('#app').innerHTML=`<section class="chef-dashboard"><div class="crumb"><a href="#/dashboard">Contributor desk</a><span class="slash">/</span>Edit recipe</div><div class="section-kicker">Your contributions</div><h1>Edit a recipe.</h1><p>Select a recipe below to change its ingredients, photo link, or cooking procedure.</p><div class="my-recipe-list">${mine.length?mine.map(r=>`<div class="my-recipe"><div><strong>${escapeHTML(r.title)}</strong><small>${escapeHTML(r.category||'Recipe')} · ${clock(r)} min</small></div><div class="desk-buttons"><a class="btn small ghost" href="#/recipe/${encodeURIComponent(r.id)}">View</a><a class="btn small primary" href="#/edit/${encodeURIComponent(r.id)}">✎ Edit</a></div></div>`).join(''):'<p class="notice">You have not added any recipes yet. Start by creating one.</p>'}</div><div class="auth-actions"><a class="btn primary" href="#/add">＋ Add Recipe</a><a class="btn ghost" href="#/dashboard">Back to kitchen desk</a></div></section>`}
function renderForm(id){const a=author();if(!a){location.hash='#/sign-in';return}const r=id?recipes.find(x=>String(x.id)===String(id)):null;if(id&&(!r||!canEdit(r))){$('#app').innerHTML='<section class="page empty"><h3>You cannot edit this recipe</h3><p>Only its original contributor can edit it.</p><a href="#/" class="btn ghost">Back to recipes</a></section>';return}const edit=!!r;const val=(key,fallback='')=>escapeHTML(r?.[key]??fallback);$('#app').innerHTML=`<section class="page"><div class="form-shell"><div class="crumb"><a href="#/">All recipes</a><span class="slash">/</span>${edit?'Edit recipe':'New recipe'}</div><div class="section-kicker">${edit?'Improve a favorite':'Share something delicious'}</div><h1 class="form-heading">${edit?'Edit your recipe.':'Add to the table.'}</h1><p class="form-copy">${edit?'Make your changes and save.':'Fill in your dish once; everyone can discover it.'} Publishing as <strong class="accent-text">${escapeHTML(a.name)}</strong>.</p><form id="recipe-form" class="form-panel"><div class="field"><label for="title">Recipe name *</label><input id="title" name="title" required maxlength="100" placeholder="Grandma’s weekend curry" value="${val('title')}"></div><div class="form-grid"><div class="field"><label for="category">Category</label><select id="category" name="category">${['Breakfast','Lunch','Dinner','Sides','Dessert','Snacks','Drinks','Other'].map(s=>`<option ${r?.category===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="servings">Servings *</label><input id="servings" name="servings" type="number" min="1" max="100" required value="${val('servings',2)}"></div></div><div class="field"><label for="description">Short description</label><textarea id="description" name="description" maxlength="400" rows="3" placeholder="What makes this dish special?">${val('description')}</textarea></div><div class="form-grid"><div class="field"><label for="prep">Preparation time (minutes)</label><input id="prep" name="prep" type="number" min="0" max="9999" required value="${val('prep_minutes',15)}"></div><div class="field"><label for="cook">Cooking time (minutes)</label><input id="cook" name="cook" type="number" min="0" max="9999" required value="${val('cook_minutes',20)}"></div></div><div class="field"><label for="ingredients">Ingredients *</label><textarea id="ingredients" name="ingredients" required rows="6" placeholder="2 tbsp olive oil&#10;1 onion, diced&#10;200 g tomatoes">${escapeHTML((r?.ingredients||[]).join('\n'))}</textarea><div class="hint">One ingredient per line. Quantities and units can go on the same line.</div></div><div class="field"><label for="steps">Cooking instructions *</label><textarea id="steps" name="steps" required rows="7" placeholder="Heat oil in a pan.&#10;Add onions and cook until soft.&#10;Stir in tomatoes and simmer.">${escapeHTML((r?.steps||[]).join('\n'))}</textarea><div class="hint">One step per line. The page numbers your steps automatically.</div></div>${!CONNECTED?`<div class="field"><label for="photo-file">Food photo (demo)</label><input id="photo-file" type="file" accept="image/png,image/jpeg,image/webp"/><div class="hint">Optional: JPG, PNG or WebP, under 750 KB. This photo stays on this browser.</div></div>`:""}<div class="field"><label for="image_url">Food photo URL</label><input id="image_url" name="image_url" type="url" placeholder="https://example.com/my-food.jpg" value="${val('image_url')&&!(r?.image_url||'').startsWith('data:')?val('image_url'):''}"><div class="hint">${CONNECTED?"Paste a public image URL. Direct image uploads will need Firebase Storage (Blaze plan).":"You can also paste a public photo URL. A demo upload takes priority."}</div></div><div class="form-actions"><button class="btn primary" id="save-button" type="submit">${edit?'Save changes':'Publish recipe'} ↗</button><a class="btn ghost" href="${edit?'#/recipe/'+encodeURIComponent(r.id):'#/'}">Cancel</a>${edit?'<button class="btn danger" type="button" id="delete-recipe">Delete recipe</button>':''}</div><div class="form-status" id="form-status" role="status"></div></form></div></section>`;$('#recipe-form').addEventListener('submit',e=>saveForm(e,r));if(edit)$('#delete-recipe').addEventListener('click',()=>deleteRecipe(r))}
function readFileData(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(new Error('Unable to read photo'));fr.readAsDataURL(file)})}
async function uploadPhoto(file){const types={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};if(!types[file.type])throw Error('Choose a JPG, PNG or WebP photo.');if(CONNECTED)throw Error('For now, please use a public food photo URL. Cloud uploads require Firebase Storage.');if(file.size>750_000)throw Error('In demo mode choose a photo smaller than 750 KB.');return await readFileData(file)}
async function saveForm(e,existing){e.preventDefault();const button=$('#save-button');button.disabled=true;$('#form-status').textContent='Saving your recipe…';try{const fd=new FormData(e.currentTarget);const ingredients=String(fd.get('ingredients')).split('\n').map(s=>s.trim()).filter(Boolean);const steps=String(fd.get('steps')).split('\n').map(s=>s.trim()).filter(Boolean);if(!ingredients.length||!steps.length)throw Error('Add at least one ingredient and one step.');if(ingredients.length>100||steps.length>60)throw Error('Please keep to 100 ingredients and 60 steps at most.');const link=String(fd.get('image_url')||'').trim();if(link&&!/^https?:\/\//i.test(link))throw Error('Photo link must begin with https:// or http://.');let photo=existing?.image_url||'';if(link)photo=link;const file=$('#photo-file')?.files?.[0];if(file)photo=await uploadPhoto(file);const a=author();const entry={title:String(fd.get('title')).trim(),description:String(fd.get('description')||'').trim(),category:String(fd.get('category')),servings:Number(fd.get('servings')),prep_minutes:Number(fd.get('prep')),cook_minutes:Number(fd.get('cook')),ingredients,steps,image_url:photo,author_id:a.id,author_name:a.name,author_email:CONNECTED?user.email:null};if(!entry.title)throw Error('Please enter a recipe name.');let id=existing?.id;if(CONNECTED){if(existing){await fb.updateDoc(fb.doc(db,'recipes',String(existing.id)),{...entry,updated_at:new Date().toISOString()});}else{id=crypto.randomUUID();await fb.setDoc(fb.doc(db,'recipes',id),{...entry,created_at:new Date().toISOString()});}await refreshRecipes()}else{if(existing){recipes=recipes.map(r=>r.id===id?{...r,...entry}:r)}else{id=crypto.randomUUID();recipes.unshift({id,...entry,created_at:new Date().toISOString()})}if(!demoSave())throw Error('Unable to save locally — browser storage full.')}notify(existing?'Recipe updated!':'Recipe published!');location.hash='#/recipe/'+encodeURIComponent(id);render()}catch(err){$('#form-status').textContent=err.message||'Unable to save recipe';button.disabled=false}}
async function deleteRecipe(r){if(!canEdit(r))return;if(!window.confirm(`Delete “${r.title}”? This cannot be undone.`))return;try{if(CONNECTED){await fb.deleteDoc(fb.doc(db,'recipes',String(r.id)));await refreshRecipes()}else{recipes=recipes.filter(x=>x.id!==r.id);demoSave()}notify('Recipe deleted');location.hash='#/';render()}catch(e){notify(e.message)}}
function renderSignIn(){if(author()){location.hash='#/dashboard';return;}if(!CONNECTED){$('#app').innerHTML=`<div class="auth-card"><div class="section-kicker">Try the contributor view</div><h1>Welcome, chef.</h1><p>This is a local preview. Choose a demo chef to open the signed-in Add Recipe and Edit Recipe buttons. This does not authenticate a real user.</p><div class="auth-actions">${DEMO_CHEFS.map(c=>`<button class="btn primary demo-signin" data-chef="${c.id}">Sign in as ${c.name}</button>`).join('')}</div><p class="notice">Live access will be restricted to your three approved email addresses by Firebase Security Rules.</p></div>`;document.querySelectorAll('.demo-signin').forEach(b=>b.onclick=()=>{activeDemo=b.dataset.chef;sessionStorage.setItem('chefs-table-preview-user',activeDemo);location.hash='#/dashboard';render();});return;}const signedIn=!!user;$('#app').innerHTML=`<div class="auth-card"><div class="section-kicker">Three approved contributors</div><h1>${signedIn?'Account status':'Welcome, chef.'}</h1><p>Sign in with one of the three approved email addresses. Readers never need an account.</p>${signedIn?`<p class="notice warning">Signed in as ${escapeHTML(user.email||'Unknown account')}, but editing is unavailable. ${!user.emailVerified?'Verify your email, then sign out and sign back in.':'This email is not on the three-person contributor list.'}</p>${!user.emailVerified?'<button id="verify-email" class="btn primary" type="button">Send verification email</button>':''}<button id="login-signout" class="btn ghost" type="button">Sign out</button>`:`<div class="auth-actions"><button class="btn primary" id="google-login">Sign in with Google</button></div><div class="auth-options"><div class="section-kicker">Or use email and password</div><form id="login-form"><div class="field"><label for="login-email">Approved email address</label><input id="login-email" type="email" autocomplete="email" required placeholder="chef@example.com"></div><div class="field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required placeholder="Your Firebase password"></div><button class="btn ghost" id="email-login" type="submit">Sign In</button></form></div>`}<p class="form-status" id="login-message" role="status"></p></div>`;const message=$('#login-message');if(signedIn){$('#verify-email')?.addEventListener('click',async()=>{try{await fb.sendEmailVerification(user);message.textContent='Verification email sent. Check your inbox.'}catch(err){message.textContent=err.message}});$('#login-signout').onclick=async()=>{await fb.signOut(auth);location.hash='#/sign-in';render()};return;}$('#google-login').onclick=async()=>{const btn=$('#google-login');btn.disabled=true;try{await fb.signInWithPopup(auth,new fb.GoogleAuthProvider());location.hash=author()?'#/dashboard':'#/sign-in';render();}catch(err){message.textContent=err.message}finally{btn.disabled=false}};$('#login-form').onsubmit=async e=>{e.preventDefault();const btn=$('#email-login');btn.disabled=true;try{await fb.signInWithEmailAndPassword(auth,$('#login-email').value.trim(),$('#login-password').value);location.hash=author()?'#/dashboard':'#/sign-in';render();}catch(err){message.textContent=err.message}finally{btn.disabled=false}};}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
init();
</script>
